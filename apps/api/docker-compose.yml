version: '3.8'
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: cmhub
      POSTGRES_PASSWORD: cmhub_password
      POSTGRES_DB: cmhub_db
    ports:
      - '5433:5432'
    volumes:
      - cmhub_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: cmhub_redis
    ports:
      - '6379:6379'
    volumes:
      - cmhub_redis_data:/data

volumes:
  cmhub_postgres_data:
  cmhub_redis_data:
