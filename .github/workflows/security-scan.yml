name: Security Audit & Automated Security PR

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Run every Monday at 08:00 UTC
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  security-audit:
    name: Dependency Security Audit & Safe PR Fix
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install Dependencies
        run: npm ci

      - name: Run Safe Audit Fix
        run: npm audit fix || true

      - name: Create Pull Request & Email Notification
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "fix(security): auto-remediate package vulnerabilities via npm audit"
          committer: "Raul Caminero <raulcaminerop@gmail.com>"
          author: "Raul Caminero <raulcaminerop@gmail.com>"
          branch: "automated-security-updates"
          title: "🔒 [Security] Automated Dependency Vulnerability Fix"
          body: |
            ## Automated Security Remediation

            This automated Pull Request was created by GitHub Actions after detecting vulnerable dependencies.
            
            - **Author**: Raul Caminero <raulcaminerop@gmail.com>
            - **Status**: Clean `npm audit fix` applied.
            - **Verification**: CI pipeline is executing tests and build checks.
          labels: |
            security
            automated-pr
